{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

{% if upstream_enabled and upstream_servers.length %}
upstream {{ upstream_name }} {
  {% if upstream_policy == "least_conn" %}
  least_conn;
  {% endif %}
  {% if upstream_policy == "ip_hash" %}
  ip_hash;
  {% endif %}
  {% for server in upstream_servers %}
  server {{ server.host }}:{{ server.port }}{% if server.weight %} weight={{ server.weight }}{% endif %}{% if server.max_fails != null %} max_fails={{ server.max_fails }}{% endif %}{% if server.fail_timeout != null %} fail_timeout={{ server.fail_timeout }}{% endif %}{% if server.backup %} backup{% endif %};
  {% endfor %}
}
{% endif %}

server {
  set $forward_scheme {{ forward_scheme }};
{% if upstream_enabled and upstream_servers.length %}
  set $server         "{{ upstream_name }}";
  set $forward_port   "";
{% else %}
  set $server         "{{ forward_host }}";
  set $forward_port   ":{{ forward_port }}";
{% endif %}
  set $port           {{ forward_port }};

{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_assets.conf" %}
{% include "_exploits.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

{% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
{% endif %}

  access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
  error_log /data/logs/proxy-host-{{ id }}_error.log warn;

{{ advanced_config }}

{{ locations }}

{% if use_default_location %}

  location / {

{% include "_access.conf" %}
{% include "_hsts.conf" %}
{% include "_rate_limit.conf" %}
{% include "_security_headers.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}

    # Proxy!
    {% include "_mtls.conf" %}
    include conf.d/include/proxy.conf;
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
{% endif %}
