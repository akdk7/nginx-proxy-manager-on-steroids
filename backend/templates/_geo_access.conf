{% if geo_access_enabled %}
  # GeoIP2 Access Control
  set $geo_access_allowed {% if geo_access_mode == "deny" %}1{% else %}0{% endif %};
  {% for country in geo_access_countries %}
  {% if geo_access_mode == "deny" %}
  if ($geoip2_country_code = "{{ country }}") { set $geo_access_allowed 0; }
  {% else %}
  if ($geoip2_country_code = "{{ country }}") { set $geo_access_allowed 1; }
  {% endif %}
  {% endfor %}
  if ($geo_access_allowed = 0) { return 403; }
{% endif %}
