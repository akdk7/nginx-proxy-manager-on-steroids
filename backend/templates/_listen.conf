{% if proxy_protocol_ports contains "80" %}
  listen 80 proxy_protocol;
{% else %}
  listen 80;
{% endif %}
{% if ipv6 -%}
{% if proxy_protocol_ports contains "80" %}
  listen [::]:80 proxy_protocol;
{% else %}
  listen [::]:80;
{% endif %}
{% else -%}
  #listen [::]:80;
{% endif %}
{% if certificate -%}
{% if proxy_protocol_ports contains "443" %}
  listen 443 ssl proxy_protocol;
{% else %}
  listen 443 ssl;
{% endif %}
{% if ipv6 -%}
{% if proxy_protocol_ports contains "443" %}
  listen [::]:443 ssl proxy_protocol;
{% else %}
  listen [::]:443 ssl;
{% endif %}
{% else -%}
  #listen [::]:443;
{% endif %}
{% if http3_support == 1 or http3_support == true %}
  listen 443 quic reuseport;
{% if ipv6 -%}
  listen [::]:443 quic reuseport;
{% else -%}
  #listen [::]:443 quic reuseport;
{% endif %}
{% endif %}
{% endif %}
{% if proxy_protocol_ports contains "80" or proxy_protocol_ports contains "443" %}
  real_ip_header proxy_protocol;
{% endif %}
  server_name {{ domain_names | join: " " }};
{% if http2_support == 1 or http2_support == true %}
  http2 on;
{% else -%}
  http2 off;
{% endif %}
{% if http3_support == 1 or http3_support == true %}
  http3 on;
  add_header Alt-Svc 'h3=":443"; ma=86400' always;
{% endif %}
