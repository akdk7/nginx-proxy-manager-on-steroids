{% for port in listen_ports_http %}
  listen {{ port }}{% if proxy_protocol_ports contains port %} proxy_protocol{% endif %};
{% if ipv6 -%}
  listen [::]:{{ port }}{% if proxy_protocol_ports contains port %} proxy_protocol{% endif %};
{% else -%}
  #listen [::]:{{ port }}{% if proxy_protocol_ports contains port %} proxy_protocol{% endif %};
{% endif %}
{% endfor %}
{% for port in listen_ports_ssl %}
  listen {{ port }} ssl{% if proxy_protocol_ports contains port %} proxy_protocol{% endif %};
{% if ipv6 -%}
  listen [::]:{{ port }} ssl{% if proxy_protocol_ports contains port %} proxy_protocol{% endif %};
{% else -%}
  #listen [::]:{{ port }} ssl{% if proxy_protocol_ports contains port %} proxy_protocol{% endif %};
{% endif %}
{% if http3_enabled and port == "443" %}
  listen 443 quic reuseport;
{% if ipv6 -%}
  listen [::]:443 quic reuseport;
{% else -%}
  #listen [::]:443 quic reuseport;
{% endif %}
{% endif %}
{% endfor %}
{% if proxy_protocol_enabled %}
  real_ip_header proxy_protocol;
{% endif %}
  server_name {{ domain_names | join: " " }};
{% if http2_support == 1 or http2_support == true %}
  http2 on;
{% else -%}
  http2 off;
{% endif %}
{% if http3_enabled %}
  http3 on;
  add_header Alt-Svc 'h3=":443"; ma=86400' always;
{% endif %}
