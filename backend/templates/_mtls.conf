{% if upstream_ssl_certificate and upstream_ssl_certificate_id > 0 and forward_scheme == "https" %}
{% if upstream_ssl_certificate.provider == "letsencrypt" %}
    proxy_ssl_certificate /etc/letsencrypt/live/npm-{{ upstream_ssl_certificate_id }}/fullchain.pem;
    proxy_ssl_certificate_key /etc/letsencrypt/live/npm-{{ upstream_ssl_certificate_id }}/privkey.pem;
{% else %}
    proxy_ssl_certificate /data/custom_ssl/npm-{{ upstream_ssl_certificate_id }}/fullchain.pem;
    proxy_ssl_certificate_key /data/custom_ssl/npm-{{ upstream_ssl_certificate_id }}/privkey.pem;
{% endif %}
{% endif %}
