{% if streams.length or stream_port_maps.length %}
{% if stream_port_maps.length %}
# Stream port maps
{% for port_map in stream_port_maps %}
map $server_port ${{ port_map.stream_port_map_variable }} {
  default {{ port_map.stream_port_map_default }};
  {% for entry in port_map.stream_port_map %}
  {{ entry.incoming_port }} {{ entry.target }};
  {% endfor %}
}
{% endfor %}

{% endif %}
{% if streams.length %}
# Stream GeoIP2 access control
upstream stream_geo_deny {
  server 127.0.0.1:1;
}

{% for stream in streams %}
map $geoip2_country_code ${{ stream.geo_access_variable }} {
  {% if stream.geo_access_mode == "deny" %}
  default {{ stream.geo_access_target }};
  {% for country in stream.geo_access_countries %}
  {{ country }} stream_geo_deny;
  {% endfor %}
  {% else %}
  default stream_geo_deny;
  {% for country in stream.geo_access_countries %}
  {{ country }} {{ stream.geo_access_target }};
  {% endfor %}
  {% endif %}
}
{% endfor %}
{% endif %}
{% endif %}
