# ------------------------------------------------------------
# {{ incoming_ports | join: ", " }} TCP: {{ tcp_forwarding }} UDP: {{ udp_forwarding }}
# ------------------------------------------------------------

{% if enabled %}
{% if upstream_enabled and upstream_servers.length %}
upstream {{ upstream_name }} {
  {% if upstream_policy == "least_conn" %}
  least_conn;
  {% endif %}
  {% if upstream_policy == "ip_hash" %}
  hash $remote_addr consistent;
  {% endif %}
  {% for server in upstream_servers %}
  server {{ server.host }}:{{ server.port }}{% if server.weight %} weight={{ server.weight }}{% endif %}{% if server.max_fails != null %} max_fails={{ server.max_fails }}{% endif %}{% if server.fail_timeout != null %} fail_timeout={{ server.fail_timeout }}{% endif %}{% if server.backup %} backup{% endif %};
  {% endfor %}
}
{% endif %}
{% if tcp_forwarding == 1 or tcp_forwarding == true -%}
server {
  {% for port in incoming_ports -%}
  listen {{ port }}{% if certificate %} ssl{% endif %}{% if proxy_protocol %} proxy_protocol{% endif %};
  {% unless ipv6 -%} # {%- endunless -%} listen [::]:{{ port }}{% if certificate %} ssl{% endif %}{% if proxy_protocol %} proxy_protocol{% endif %};
  {%- endfor %}

  {%- include "_certificates_stream.conf" %}

  {% if proxy_protocol_upstream %}
  proxy_protocol on;
  {% endif %}

  access_log /data/logs/stream-{{ id }}_access.log stream;
  error_log /data/logs/stream-{{ id }}_error.log warn;

  {% if geo_access_enabled %}
  proxy_pass ${{ geo_access_variable }};
  {% elsif upstream_enabled and upstream_servers.length %}
  proxy_pass {{ upstream_name }};
  {% else %}
  proxy_pass {{ stream_proxy_pass_target }};
  {% endif %}

  # Custom
  include /data/nginx/custom/server_stream[.]conf;
  include /data/nginx/custom/server_stream_tcp[.]conf;
}
{% endif %}

{% if udp_forwarding == 1 or udp_forwarding == true -%}
server {
  {% for port in incoming_ports -%}
  listen {{ port }} udp;
  {% unless ipv6 -%} # {%- endunless -%} listen [::]:{{ port }} udp;
  {%- endfor %}

  access_log /data/logs/stream-{{ id }}_access.log stream;
  error_log /data/logs/stream-{{ id }}_error.log warn;

  {% if geo_access_enabled %}
  proxy_pass ${{ geo_access_variable }};
  {% elsif upstream_enabled and upstream_servers.length %}
  proxy_pass {{ upstream_name }};
  {% else %}
  proxy_pass {{ stream_proxy_pass_target }};
  {% endif %}

  # Custom
  include /data/nginx/custom/server_stream[.]conf;
  include /data/nginx/custom/server_stream_udp[.]conf;
}
{% endif %}
{% endif %}
