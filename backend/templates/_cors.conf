{% if cors and cors.enabled %}
    if ({{ cors.origin_variable }} != "") {
      add_header Access-Control-Allow-Origin {{ cors.origin_variable }} always;
      add_header Vary "Origin" always;
      {% if cors.allow_credentials %}
      add_header Access-Control-Allow-Credentials "true" always;
      {% endif %}
      add_header Access-Control-Allow-Methods "{{ cors.allow_methods }}" always;
      add_header Access-Control-Allow-Headers "{{ cors.allow_headers }}" always;
      {% if cors.expose_headers %}
      add_header Access-Control-Expose-Headers "{{ cors.expose_headers }}" always;
      {% endif %}
      add_header Access-Control-Max-Age {{ cors.max_age }} always;
    }
{% endif %}
