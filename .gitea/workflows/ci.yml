name: ci

on:
  push:
  pull_request:

env:
  DOCKER_IMAGE: akdk7/nginx-proxy-manager-on-steroids
  GITHUB_REPO: akdk7/nginx-proxy-manager-on-steroids

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect .version change
        id: version_change
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          changed=false
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed=true
          else
            if command -v rg >/dev/null; then
              if git diff --name-only "$BEFORE" "$AFTER" | rg -q "^\\.version$"; then
                changed=true
              fi
            else
              if git diff --name-only "$BEFORE" "$AFTER" | grep -Fxq ".version"; then
                changed=true
              fi
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read versions
        id: version_info
        if: github.event_name == 'push' && steps.version_change.outputs.changed == 'true'
        run: |
          set -euo pipefail
          base_version="$(tr -d '[:space:]' < .version)"
          app_version="$(node -p "require('./backend/package.json').version")"
          echo "base=$base_version" >> "$GITHUB_OUTPUT"
          echo "app=$app_version" >> "$GITHUB_OUTPUT"
      - name: Frontend lint/test/build
        working-directory: frontend
        env:
          CI: true
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
          yarn lint
          yarn test:ci
          yarn build
      - name: Docker build
        run: docker buildx build -f docker/Dockerfile --platform linux/amd64 -t nginx-proxy-manager:local --load . --no-cache
      - name: Docker login
        if: github.event_name == 'push' && steps.version_change.outputs.changed == 'true'
        env:
          DOCKERHUB_AUTH: ${{ secrets.NGINX_PROXY_MANAGER_ON_STEROIDS }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_AUTH}" ]]; then
            echo "Missing Docker Hub secret 'NGINX_PROXY_MANAGER_ON_STEROIDS'."
            exit 1
          fi
          if [[ "${DOCKERHUB_AUTH}" == *:* ]]; then
            DOCKERHUB_USERNAME="${DOCKERHUB_AUTH%%:*}"
            DOCKERHUB_TOKEN="${DOCKERHUB_AUTH#*:}"
          else
            DOCKERHUB_TOKEN="${DOCKERHUB_AUTH}"
            DOCKERHUB_USERNAME="${DOCKER_IMAGE%%/*}"
            if [[ -z "${DOCKERHUB_USERNAME}" || "${DOCKERHUB_USERNAME}" == "${DOCKER_IMAGE}" ]]; then
              echo "Unable to infer Docker Hub username. Use 'username:token' format."
              exit 1
            fi
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Docker build & push
        if: github.event_name == 'push' && steps.version_change.outputs.changed == 'true'
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}
          BASE_VERSION: ${{ steps.version_info.outputs.base }}
          APP_VERSION: ${{ steps.version_info.outputs.app }}
        run: |
          docker buildx build -f docker/Dockerfile --platform linux/amd64 \
            --build-arg BUILD_VERSION="${APP_VERSION}" \
            -t "${IMAGE}:${APP_VERSION}" \
            -t "${IMAGE}:${BASE_VERSION}" \
            -t "${IMAGE}:latest" \
            --push . --no-cache
      - name: Prepare GitHub release notes
        id: gh_release_notes
        if: github.event_name == 'push' && steps.version_change.outputs.changed == 'true'
        env:
          GITHUB_REPO: ${{ env.GITHUB_REPO }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .version)"
          tag="v${version}"
          last_tag=""
          last_sha=""
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            latest_json="$(curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPO}/releases/latest" || true)"
          else
            latest_json=""
          fi
          if [[ -n "${latest_json}" ]]; then
            last_tag="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))' \
              <<< "${latest_json}")"
          fi
          if [[ -n "${last_tag}" ]]; then
            ref_json="$(curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPO}/git/ref/tags/${last_tag}" || true)"
            if [[ -n "${ref_json}" ]]; then
              last_type="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("object", {}).get("type",""))' \
                <<< "${ref_json}")"
              last_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("object", {}).get("sha",""))' \
                <<< "${ref_json}")"
              if [[ "${last_type}" == "tag" && -n "${last_sha}" ]]; then
                tag_json="$(curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${GITHUB_REPO}/git/tags/${last_sha}" || true)"
                last_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("object", {}).get("sha",""))' \
                  <<< "${tag_json}")"
              fi
            fi
          fi
          if [[ -n "${last_sha}" ]] && git cat-file -e "${last_sha}^{commit}" 2>/dev/null; then
            header="Changes since ${last_tag}"
            notes="$(git log "${last_sha}..HEAD" --pretty=format:'- %s (%h)')"
          else
            header="Recent changes"
            notes="$(git log -n 50 --pretty=format:'- %s (%h)')"
          fi
          if [[ -z "${notes}" ]]; then
            notes="- No changes detected."
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<'EOF'"
            echo "${header}"
            echo
            echo "${notes}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: github.event_name == 'push' && steps.version_change.outputs.changed == 'true'
        env:
          GITHUB_REPO: ${{ env.GITHUB_REPO }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG_NAME: ${{ steps.gh_release_notes.outputs.tag }}
          RELEASE_BODY: ${{ steps.gh_release_notes.outputs.body }}
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_TOKEN}" ]]; then
            echo "Missing GitHub release token (RELEASE_TOKEN)."
            exit 1
          fi
          if curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${TAG_NAME}" >/dev/null; then
            echo "GitHub release ${TAG_NAME} already exists. Skipping."
            exit 0
          fi
          payload="$(python3 -c 'import json,os; print(json.dumps({"tag_name": os.environ["TAG_NAME"], "name": os.environ["TAG_NAME"], "body": os.environ["RELEASE_BODY"], "draft": False, "prerelease": False}))')"
          curl -fsSL -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPO}/releases" \
            -d "${payload}"
